<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../styles/browser.css">
        <script>
            navigator.serviceWorker.register('/sail/sw.js');
        </script>
        <script src="/sail/baremux/index.js"></script>
        <script src="/sail/scram/scramjet.all.js"></script>
    </head>
    <body>
        <div class="topbar">
            <button class="nav-btn" id="backBtn">
                <i data-lucide="arrow-left"></i>
            </button>
            <button class="nav-btn" id="fwdBtn">
                <i data-lucide="arrow-right"></i>
            </button>
            <button class="nav-btn" id="refreshBtn">
                <i data-lucide="rotate-cw"></i>
            </button>
            <div class="url-bar">
                <i data-lucide="search"></i>
                <input type="text" id="urlInput" placeholder="search or enter a URL...">
                <button id="goBtn"><i data-lucide="arrow-right"></i></button>
            </div>
        </div>
        <iframe id="browserFrame"></iframe>
        <script src="../scripts/browser.js"></script>
    </body>
</html>
