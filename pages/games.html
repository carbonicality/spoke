<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../styles/games.css">
    </head>
    <body>
        <div class="gametainer">
            <div class="search-sec">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="gameSearch" placeholder="search games...">
                </div>
            </div>
            <div id="gameGrid" class="game-grid"></div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <i data-lucide="gamepad-2"></i>
                <span>no games found</span>
            </div>  
        </div>
        <iframe id="zoneFrame" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;"></iframe>
        <button id="closeGame" onclick="closeGame()">
                <i data-lucide="x" width="16" height="16"></i>
        </button>
        <button id="fsBtn" onclick="tglFullscreen()">
            <i data-lucide="maximize" width="16" height="16"></i>
        </button>
        <script src="../scripts/games.js"></script>
    </body>
</html>
